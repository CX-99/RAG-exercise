[project]
name = "rag-backend"
version = "0.1.0"
description = "FastAPI backend for the policy-document RAG assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "numpy>=2.2.0",
    "openai>=3.26.1",
    "rank-bm25>=0.2.2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
    "pdfplumber>=0.11.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error", "ignore::pytest.PytestCacheWarning"]

[tool.pyright]
# Type-check with the project's virtual environment: run `npx pyright@1.1.408` here.
venvPath = "."
venv = ".venv"
include = ["app", "tests", "evals", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.10",
]
